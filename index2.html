<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stli的前端作品集</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!-- 顶部 Hero 区域 -->
    <section class="hero">
        <div class="hero-dot"></div>
        <h1 class="hero-title">stli的前端作品集</h1>
        <p class="hero-desc">
            这是我的前端网页作品合集，<br>
            点击卡片即可跳转到对应的项目页面
        </p>
    </section>

    <!-- 作品展示区域 -->
    <section class="works">
        <h2 class="section-title">My Projects</h2>

        <div class="card-grid">

            <!-- 作品1：Quiz Game -->
            <a href="https://quiz-game-murex-five.vercel.app/" target="_blank" class="card">
                <div class="card-img">
                    <img src="quiz-game.png" alt="Quiz Game">
                </div>
                <div class="card-body">
                    <div class="card-index"><span>1</span></div>
                    <div class="card-text">
                        <h3>Quiz Time</h3>
                        <p>基于 HTML/CSS/JS 的前端答题小游戏，测试你的知识储备</p>
                    </div>
                    <span class="tag">Quiz</span>
                </div>
            </a>

            <!-- 作品2：注册页面 -->
            <a href="https://register-page-mu.vercel.app/" target="_blank" class="card">
                <div class="card-img">
                    <img src="register-page.png" alt="注册页面">
                </div>
                <div class="card-body">
                    <div class="card-index"><span>2</span></div>
                    <div class="card-text">
                        <h3>Register Form</h3>
                        <p>用户注册表单页面，包含实时校验与交互反馈</p>
                    </div>
                    <span class="tag">Register</span>
                </div>
            </a>

            <!-- 作品3：菜单搜索器 -->
            <a href="https://menu-search-three.vercel.app/" target="_blank" class="card">
                <div class="card-img">
                    <img src="menu-search.png" alt="菜单搜索器">
                </div>
                <div class="card-body">
                    <div class="card-index"><span>3</span></div>
                    <div class="card-text">
                        <h3>Recipe Finder</h3>
                        <p>菜单搜索器，支持关键词搜索和分类筛选功能</p>
                    </div>
                    <span class="tag">Recipe</span>
                </div>
            </a>

        </div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
        <p>Built by <span class="highlight">stli</span> · 2026 Web Development Course</p>
    </footer>

</body>
</html>
